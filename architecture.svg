<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1120" viewBox="0 0 680 560" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Concentric ring architecture with labels set inside each ring, judgment and trust gates on ingestion, feedback, and routing</title>
<desc>Five concentric rings, each with its own label sitting inside a small gap in the ring itself. From outer to inner: acquisition, data and knowledge, reasoning store, model compute, trust store, and a core split into frontier model and vertical models. Amber gate markers sit at ingestion, routing, and on the feedback path.</desc>

<rect x="0" y="0" width="680" height="560" fill="#FFFFFF"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  text{ font-family:'Inter','Helvetica Neue',Arial,sans-serif; fill:#13182B; }
  .ts{ font-size:12px; }
  .th{ font-size:13px; font-weight:600; }
  .ring{ fill:none; stroke:#9099A8; stroke-width:0.6; }
</style>

<text class="ts" x="280" y="22" text-anchor="middle">Data in</text>
<line x1="280" y1="28" x2="280" y2="53" stroke="#13182B" stroke-width="1" marker-end="url(#arrow)"/>

<path class="ring" d="M 325 60 A 205 205 0 1 1 235 60" stroke-dasharray="3 3"/>
<text class="ts" x="280" y="58" text-anchor="middle">Acquisition</text>

<path class="ring" d="M 352 95 A 180 180 0 1 1 208 95"/>
<text class="ts" x="280" y="88" text-anchor="middle">Data and knowledge</text>

<path class="ring" d="M 368 141 A 148 148 0 1 1 192 141"/>
<text class="ts" x="280" y="127" text-anchor="middle">Reasoning store</text>

<path class="ring" d="M 329 153 A 118 118 0 1 1 231 153"/>
<text class="ts" x="280" y="148" text-anchor="middle">Model compute</text>

<path class="ring" d="M 321 180 A 90 90 0 1 1 239 180"/>
<text class="ts" x="280" y="175" text-anchor="middle">Trust store</text>

<circle cx="280" cy="260" r="65" fill="#EAF1FC" stroke="#1F6FD0" stroke-width="0.8"/>
<line x1="228" y1="260" x2="332" y2="260" stroke="#1F6FD0" stroke-width="0.8"/>
<text class="ts" x="280" y="248" text-anchor="middle" fill="#13477E">Frontier model</text>
<text class="ts" x="280" y="272" text-anchor="middle" fill="#13477E">Vertical models</text>

<circle cx="245" cy="72"  r="6" fill="#F47820" stroke="#D85A12" stroke-width="0.6"/>
<circle cx="182" cy="280" r="6" fill="#F47820" stroke="#D85A12" stroke-width="0.6"/>

<path d="M 260 480 C 140 480, 45 420, 45 260 C 45 150, 90 85, 158 66"
      fill="none" stroke="#D85A12" stroke-width="1.1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<circle cx="45" cy="260" r="6" fill="#F47820" stroke="#D85A12" stroke-width="0.6"/>

<line x1="280" y1="465" x2="280" y2="483" stroke="#13182B" stroke-width="1" marker-end="url(#arrow)"/>
<text class="th" x="280" y="502" text-anchor="middle">Consumption</text>
<text class="ts" x="280" y="520" text-anchor="middle" fill="#5A6072">Apps, agents, BI</text>

<rect x="80" y="540" width="12" height="12" rx="6" fill="none" stroke="#9099A8" stroke-width="0.6"/>
<text class="ts" x="98" y="550">Data and model layers</text>
<circle cx="336" cy="546" r="6" fill="#F47820" stroke="#D85A12" stroke-width="0.6"/>
<text class="ts" x="348" y="550">Judgment and trust gate</text>

</svg>
